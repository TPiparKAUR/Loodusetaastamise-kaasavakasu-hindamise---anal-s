name: Veebileht

# Ehitab saidi igal pushil (kontrolliks) ja avaldab GitHub Pages'is ainult repo VAIKEHARUST,
# olenemata selle nimest. Vajab: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python -m oks site --out _site
      - name: Kontrolli, et leht ja andmed on olemas
        run: |
          test -s _site/index.html
          test -s _site/data/paarid.json
          test -s _site/oks-seisund.html
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
